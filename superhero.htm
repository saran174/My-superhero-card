<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Superhero</title>
    <style>
        body {
                  background-color: blue;
                  color: azure;
                font-family: Arial,  sans-serif;
        }

        .hero-name {
                          font-size: 60px;
font-weight: bold;
color: peru;
text-shadow: capitalize;
        }

        .tagline {
font-style: italic;
color: aqua;
text-transform: capitalize;
        }

        .lable {
text-transform: uppercase;
text-decoration: underline;
color: blueviolet;


        }

        .power {
font-weight: bold;
color: darkslateblue;


        }

        .weakness {
text-decoration: line-through;
color: gray;


        }

        .badge {
font-size: 28px;
font-weight: bold;
color: gold;
transform: rotate(15deg);
        }

        .made-by {
color:coral;
font-style: italic;

        }
    </style>
</head>
<body>
    <h1 class="hero-name">Thunder kid</h1>
    <p class="tagline">The most powerful hero in the school.</p>

    <h2 class="lable">Super powers</h2>
    <p class="power">can run faster than a cheetah.</p>
    <p class="power">can lift a a school bus.</p>

    <h2 class="lable">Weakness</h2>
    <p class="Weakness">Maths exam.</p>
    <p class="Weakness">Vegetables</p>

    <p class="badge">Top Heros</p>

    <p class="made-by">Created by saran karthik</p>

    </body>


</html>
